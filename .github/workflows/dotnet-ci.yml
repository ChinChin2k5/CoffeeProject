name: .NET Core CI Pipeline

# 1. Định nghĩa sự kiện kích hoạt (Triggers)
on:
  push:
    branches: [ "main", "develop" ] # Tự động chạy khi push code lên main hoặc develop
  pull_request:
    branches: [ "main" ]          # Tự động chạy khi có PR tạo vào nhánh main

# 2. Định nghĩa các công việc cần làm (Jobs)
jobs:
  build-and-test:
    runs-on: ubuntu-latest # Chạy trên một server ảo cài sẵn hệ điều hành Ubuntu của GitHub

    steps:
    # Bước 2.1: Lấy mã nguồn mới nhất từ repo về server ảo
    - name: Checkout source code
      uses: actions/checkout@v4

    # Bước 2.2: Cài đặt môi trường .NET SDK
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0' # Điều chỉnh phiên bản đúng với phiên bản dự án đang dùng

    # Bước 2.3: Khôi phục các thư viện/dependencies (Giống như chạy lệnh dotnet restore)
    - name: Restore dependencies
      run: dotnet restore

    # Bước 2.4: Biên dịch code xem có lỗi cú pháp hay không
    - name: Build project
      run: dotnet build --no-restore --configuration Release

    # Bước 2.5: Chạy toàn bộ các bài Unit Test trong dự án
    - name: Run Test cases
      run: dotnet test --no-build --verbosity normal